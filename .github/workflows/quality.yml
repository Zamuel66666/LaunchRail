name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code quality and application health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint documentation
        run: pnpm docs:lint

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build applications
        run: pnpm build

      - name: Smoke-test application health endpoints
        run: pnpm smoke:health

  development-services:
    name: PostgreSQL, Redis, and restart invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://launchrail:launchrail_dev_only@127.0.0.1:5432/launchrail
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Start development services
        run: docker compose --env-file .env.example up -d --wait

      - name: Verify PostgreSQL
        run: docker compose exec -T postgres pg_isready -U launchrail -d launchrail

      - name: Verify Redis
        run: test "$(docker compose exec -T redis redis-cli ping)" = PONG

      - name: Apply clean PostgreSQL migrations
        run: pnpm db:migrate

      - name: Test ownership and transition transactions
        run: pnpm test:database

      - name: Test durable queue and worker recovery
        run: pnpm test:queue

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Show service state
        if: always()
        run: docker compose ps

      - name: Stop development services
        if: always()
        run: docker compose down --volumes
