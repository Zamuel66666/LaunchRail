name: launchrail

services:
  buildkit:
    profiles: [build]
    container_name: launchrail-buildkit
    image: moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
    privileged: true
    mem_limit: 2g
    memswap_limit: 2g
    cpu_period: 100000
    cpu_quota: 200000
    command: [--config, /etc/buildkit/buildkitd.toml, --oci-worker-net=bridge]
    volumes:
      - ./.github/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-launchrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchrail_dev_only}
      POSTGRES_USER: ${POSTGRES_USER:-launchrail}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    restart: unless-stopped
    volumes:
      - redis-data:/data

  traefik:
    image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=127.0.0.1:${TRAEFIK_PORT:-8080}
      - --entrypoints.traefik.address=127.0.0.1:${TRAEFIK_HEALTH_PORT:-18082}
      - --ping=true
      - --accesslog=false
      - --api=false
    network_mode: host
    healthcheck:
      test:
        [
          CMD,
          traefik,
          healthcheck,
          --ping,
          "--entrypoints.traefik.address=127.0.0.1:${TRAEFIK_HEALTH_PORT:-18082}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    restart: unless-stopped
    volumes:
      - ${TRAEFIK_DYNAMIC_CONFIG_DIR:-./.launchrail/traefik}:/etc/traefik/dynamic

volumes:
  postgres-data:
  redis-data:
