name: launchrail

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-launchrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchrail_dev_only}
      POSTGRES_USER: ${POSTGRES_USER:-launchrail}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    restart: unless-stopped
    volumes:
      - redis-data:/data

  traefik:
    image: traefik:v3.3.6@sha256:5809533c5b3fdfd961aa20af1cfbbc7d0e8ce3c4c3b1ee9acb0da00b7871c53b
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=false
      - --api=false
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    ports:
      - 127.0.0.1:${TRAEFIK_PORT:-8080}:80
    restart: unless-stopped
    volumes:
      - ${TRAEFIK_DYNAMIC_CONFIG_DIR:-./.launchrail/traefik}:/etc/traefik/dynamic

volumes:
  postgres-data:
  redis-data:
