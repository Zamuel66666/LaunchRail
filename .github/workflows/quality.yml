name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code quality and application health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint documentation
        run: pnpm docs:lint

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build applications
        run: pnpm build

      - name: Smoke-test application health endpoints
        run: pnpm smoke:health

  development-services:
    name: PostgreSQL, Redis, and restart invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://launchrail:launchrail_dev_only@127.0.0.1:5432/launchrail
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Start development services
        run: docker compose --env-file .env.example up -d --wait

      - name: Verify PostgreSQL
        run: docker compose exec -T postgres pg_isready -U launchrail -d launchrail

      - name: Verify Redis
        run: test "$(docker compose exec -T redis redis-cli ping)" = PONG

      - name: Apply clean PostgreSQL migrations
        run: pnpm db:migrate

      - name: Test ownership and transition transactions
        run: pnpm test:database

      - name: Test durable queue and worker recovery
        run: pnpm test:queue

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Show service state
        if: always()
        run: docker compose ps

      - name: Stop development services
        if: always()
        run: docker compose down --volumes

  buildkit-acceptance:
    name: Constrained BuildKit acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_CONFIG: /tmp/launchrail-ci-docker-config
      LAUNCHRAIL_BUILDX_BUILDER: launchrail-builder
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare isolated Docker client configuration
        run: |
          mkdir --parents "$DOCKER_CONFIG"
          chmod 0700 "$DOCKER_CONFIG"

      - name: Provision constrained BuildKit builder
        run: |
          docker run --detach --name launchrail-buildkit --privileged --network bridge \
            --memory 2g --memory-swap 2g --cpu-period 100000 --cpu-quota 200000 \
            --volume "$GITHUB_WORKSPACE/.github/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro" \
            moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 \
            --config /etc/buildkit/buildkitd.toml --oci-worker-net=bridge

      - name: Connect pinned Buildx client
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: remote
          endpoint: docker-container://launchrail-buildkit
          name: launchrail-builder
          version: v0.36.1

      - name: Verify pinned builder boundary
        run: |
          test "$(docker buildx version | awk '{print $2}')" = "v0.36.1"
          docker buildx inspect --builder launchrail-builder --bootstrap | grep -F "v0.32.2"
          test "$(docker inspect launchrail-buildkit --format '{{.Config.Image}}')" = "moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8"
          ! docker inspect launchrail-buildkit --format '{{json .Args}}' | grep -F 'allow-insecure-entitlement'

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exercise real BuildKit boundary
        run: pnpm test:buildkit

      - name: Exercise restricted Docker runtime lifecycle
        run: pnpm test:runtime

      - name: Show builder diagnostics after failure
        if: failure()
        run: |
          docker buildx inspect --builder launchrail-builder
          docker buildx du --builder launchrail-builder || true
          docker logs launchrail-buildkit

      - name: Remove acceptance builder
        if: always()
        run: docker rm --force launchrail-buildkit
