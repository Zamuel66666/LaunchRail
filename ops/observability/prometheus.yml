global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/launchrail-alerts.yml

scrape_configs:
  - job_name: launchrail-api
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:4000]

  - job_name: launchrail-worker
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:4001]
