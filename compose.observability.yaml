name: launchrail

services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    network_mode: host
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/launchrail-alerts.yml:/etc/prometheus/launchrail-alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set a unique local Grafana password}
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3001}
      GF_USERS_ALLOW_SIGN_UP: "false"
    network_mode: host
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/launchrail.yml:ro
      - ./ops/observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/launchrail.yml:ro
      - ./ops/observability/grafana/launchrail-overview.json:/etc/grafana/dashboards/launchrail-overview.json:ro

volumes:
  grafana-data:
  prometheus-data:
